<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>observec · probe log</title>
  <link rel="icon" type="image/png" href="/observec.png?v=20260906w" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="/styles.css?v=20261013a" />
  <style>
    body { background: var(--background); }
    .pl-header {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; gap: 8px;
      padding: 12px 16px;
      background: var(--header-bg);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid var(--border);
    }
    .pl-title {
      margin-right: auto;
      font-size: 12.5px;
      font-family: var(--mono);
      color: var(--muted-foreground);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .search-wrap { width: 230px; position: relative; flex-shrink: 0; }
    .icon-btn { width: 30px; height: 30px; }
    .icon-btn:disabled { opacity: .45; cursor: default; }
    .log-count { min-width: 48px; text-align: right; font-size: 12px; }
    .pl-body { max-width: 1100px; margin: 0 auto; padding: 18px 20px 40px; }
    .pl-lines { font-size: 12px; line-height: 1.75; font-family: var(--mono); color: var(--log-text, var(--muted-foreground)); }
    .pl-line { padding: 1px 0; white-space: pre-wrap; word-break: break-all; }
    .pl-line:hover { background: var(--elevated); }
    .hl { background: var(--mark-bg, var(--acc-dim)); color: var(--acc); border-radius: 2px; }
    .hl.current { background: var(--acc); color: var(--primary-foreground); }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 4px; }
    html.light { --log-text: var(--muted-foreground); --mark-bg: var(--acc-dim); }
  </style>
  <script>
    try {
      var plTheme = localStorage.getItem("observec-theme") || "black";
      if (plTheme === "light") plTheme = "white";
      if (plTheme === "dark") plTheme = "black";
      if (plTheme !== "grey" && plTheme !== "black" && plTheme !== "white") plTheme = "black";
      document.documentElement.dataset.theme = plTheme;
      document.documentElement.classList.toggle("light", plTheme === "white");
      var plAccents = {
        green: { dark: "#5ee08a", greyDim: "#1f3125", blackDim: "#0d1f13", light: "#0f7a3a", lightDim: "#e7f0eb" },
        blue: { dark: "#5b9dff", greyDim: "#1f2836", blackDim: "#0d1624", light: "#2260cf", lightDim: "#e9eef7" },
        red: { dark: "#ff5555", greyDim: "#361e1e", blackDim: "#240c0c", light: "#c92a2a", lightDim: "#f6e9e9" },
        yellow: { dark: "#f2c94c", greyDim: "#342e1d", blackDim: "#221c0b", light: "#7f5f00", lightDim: "#f0eee6" },
        orange: { dark: "#ff9640", greyDim: "#36271b", blackDim: "#241509", light: "#a84c00", lightDim: "#f3ece6" },
        purple: { dark: "#b48cff", greyDim: "#2b2636", blackDim: "#191424", light: "#6a42d0", lightDim: "#eeebf7" },
        pink: { dark: "#ff7ac6", greyDim: "#36232e", blackDim: "#24111c", light: "#b82c74", lightDim: "#f5eaef" }
      };
      var plAccent = localStorage.getItem("observec-accent") || "orange";
      if (!plAccents[plAccent]) plAccent = "orange";
      document.documentElement.dataset.accent = plAccent;
      var plEntry = plAccents[plAccent];
      var plIsWhite = plTheme === "white";
      var plAcc = plIsWhite ? plEntry.light : plEntry.dark;
      var plDim = plIsWhite ? plEntry.lightDim : (plTheme === "grey" ? plEntry.greyDim : plEntry.blackDim);
      document.documentElement.style.setProperty("--acc", plAcc);
      document.documentElement.style.setProperty("--acc-dim", plDim);
      document.documentElement.style.setProperty("--primary", plAcc);
      document.documentElement.style.setProperty("--success", plAcc);
    } catch (e) {}
  </script>
</head>
<body>
  <header class="pl-header">
    <span class="pl-title mono" id="pl-title">probe log</span>

    <div class="search-wrap">
      <svg class="icon search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="pl-search" class="input search" type="search" placeholder="Search" autocomplete="off" />
    </div>

    <span id="pl-count" class="text-muted log-count"></span>

    <button type="button" class="icon-btn" id="pl-prev" data-action-tip="Previous match (Shift+Enter)" disabled>
      <svg class="icon" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></svg>
    </button>
    <button type="button" class="icon-btn" id="pl-next" data-action-tip="Next match (Enter)" disabled>
      <svg class="icon" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
    </button>

    <button type="button" class="btn ghost icon-only" id="pl-copy" data-action-tip="Copy log" aria-label="Copy log">
      <svg class="icon" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
    </button>
  </header>

  <main class="pl-body">
    <div id="pl-lines" class="pl-lines mono"></div>
  </main>

  <script>
    (function () {
      "use strict";

      var params = new URLSearchParams(window.location.search);
      var probeId = params.get("id") || "";
      var moduleName = params.get("module") || "";

      var rawLines = [];
      var marks = [];
      var current = -1;
      var query = "";
      var timer = null;

      function $(id) { return document.getElementById(id); }

      $("pl-title").textContent =
        "probe #" + (probeId || "?") + (moduleName ? " \u00b7 " + moduleName : "");

      fetch("/blackbox/probe-log?id=" + encodeURIComponent(probeId))
        .then(function (res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.text();
        })
        .then(function (text) {
          rawLines = text.split("\n");
          if (rawLines.length && rawLines[rawLines.length - 1] === "") rawLines.pop();
          render();
        })
        .catch(function (err) {
          rawLines = ["failed to load probe log : " + err.message];
          render();
        });

      function render() {
        var container = $("pl-lines");
        container.innerHTML = "";

        rawLines.forEach(function (text) {
          var line = document.createElement("div");
          line.className = "pl-line";
          line.appendChild(document.createTextNode(text));
          container.appendChild(line);
        });

        applyHighlight();
      }

      function applyHighlight() {
        var rows = $("pl-lines").querySelectorAll(".pl-line");
        marks = [];
        current = -1;

        Array.prototype.forEach.call(rows, function (row, index) {
          var raw = rawLines[index] !== undefined ? rawLines[index] : "";
          row.textContent = "";

          if (!query) {
            row.appendChild(document.createTextNode(raw));
            return;
          }

          var lower = raw.toLowerCase();
          var needle = query.toLowerCase();
          var position = 0;
          var found;

          while ((found = lower.indexOf(needle, position)) !== -1) {
            if (found > position) {
              row.appendChild(document.createTextNode(raw.slice(position, found)));
            }
            var mark = document.createElement("mark");
            mark.className = "hl";
            mark.textContent = raw.slice(found, found + needle.length);
            row.appendChild(mark);
            marks.push(mark);
            position = found + needle.length;
          }
          if (position < raw.length) {
            row.appendChild(document.createTextNode(raw.slice(position)));
          }
        });

        updateUi();
      }

      function updateUi() {
        var total = marks.length;
        $("pl-count").textContent = !query
          ? ""
          : (!total ? "no matches" : (current + 1) + "/" + total);
        $("pl-prev").disabled = !total;
        $("pl-next").disabled = !total;
      }

      function jump(direction) {
        if (!marks.length) return;
        if (current >= 0 && marks[current]) marks[current].classList.remove("current");
        current = (current + direction + marks.length) % marks.length;
        marks[current].classList.add("current");
        marks[current].scrollIntoView({ block: "center" });
        updateUi();
      }

      $("pl-search").addEventListener("input", function () {
        var value = this.value.trim();
        if (timer) clearTimeout(timer);
        timer = setTimeout(function () {
          query = value;
          applyHighlight();
        }, 160);
      });

      $("pl-search").addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          event.preventDefault();
          jump(event.shiftKey ? -1 : 1);
        }
      });

      $("pl-prev").addEventListener("click", function () { jump(-1); });
      $("pl-next").addEventListener("click", function () { jump(1); });

      $("pl-copy").addEventListener("click", function () {
        var btn = this;
        var original = btn.innerHTML;
        navigator.clipboard.writeText(rawLines.join("\n"))
          .then(function () {
            btn.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>';
            setTimeout(function () { btn.innerHTML = original; }, 1500);
          })
          .catch(function () {
            btn.style.color = "var(--err)";
            setTimeout(function () { btn.style.color = ""; }, 1500);
          });
      });

      var tipEl = null;
      function hideTip() {
        if (tipEl) tipEl.classList.remove("visible");
      }
      function showTip(anchor) {
        var text = anchor && anchor.getAttribute("data-action-tip");
        if (!text) return;
        if (!tipEl) {
          tipEl = document.createElement("div");
          tipEl.className = "info-tip-float";
          tipEl.setAttribute("role", "tooltip");
          document.body.appendChild(tipEl);
        }
        tipEl.textContent = text;
        tipEl.style.left = "0px";
        tipEl.style.top = "0px";
        tipEl.classList.add("visible");
        var r = anchor.getBoundingClientRect();
        var tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
        var top = r.top - th - 8;
        if (top < 8) top = r.bottom + 8;
        var left = Math.max(8, Math.min(r.left + r.width / 2 - tw / 2, window.innerWidth - tw - 8));
        tipEl.style.left = left + "px";
        tipEl.style.top = top + "px";
      }
      document.addEventListener("mouseover", function (e) {
        var t = e.target && e.target.closest ? e.target.closest("[data-action-tip]") : null;
        if (t) showTip(t);
      });
      document.addEventListener("mouseout", hideTip);
      document.addEventListener("click", hideTip);
      window.addEventListener("scroll", hideTip, true);
    })();
  </script>
</body>
</html>
