name: Publish Maven Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-publish-engine:
    name: Build and Publish Engine to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Sync frontend dist into Spring static (mirrors Dockerfile)
        run: |
          mkdir -p observecEngine/src/main/resources/static
          cp -r observecInterface/dist/. observecEngine/src/main/resources/static/
          ls -la observecEngine/src/main/resources/static

      - name: Deploy Engine to GitHub Packages
        run: mvn -B clean deploy --file ./observecEngine/pom.xml -DskipTests -s $GITHUB_WORKSPACE/settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
